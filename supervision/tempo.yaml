# Tempo 3 en un seul processus (-target=all par défaut) : sans Kafka, réservé aux déploiements microservices.
# Conservation : 14 jours, valeur par défaut (block_retention: 336h). Le journal des réponses (base) garde 12 mois.

stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
