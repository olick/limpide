# Loki en un seul processus, stockage sur disque. Reçoit les journaux de l'application en OTLP (par le collecteur) ;
# l'identifiant de trace de chaque message est gardé (métadonnées structurées), d'où le lien vers Tempo dans Grafana.
# Conservation : 14 jours (compacteur).

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Cache des résultats de requêtes en mémoire : 100 Mo par défaut, trop pour le serveur.
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

analytics:
  reporting_enabled: false
