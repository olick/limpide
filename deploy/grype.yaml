# Configuration de Grype pour deploy/analyser-images.sh (ADR-015).
#
# Exceptions : une vulnérabilité bloquante qu'on accepte en connaissance de cause (composant non utilisé, correctif
# impossible à court terme). Chaque règle porte une raison et une date, reprises dans le rapport JSON
# (ignoredMatches) et comptées à part dans le résumé. Une exception se retire dès que le correctif est passé.
#
# ignore:
#   - vulnerability: CVE-AAAA-NNNNN
#     package:
#       name: nom-du-paquet
#     reason: "pourquoi on l'accepte, jusqu'à quand (AAAA-MM-JJ)"
ignore:
  # Attaque de l'installation d'un paquet par apt : aucune image ne lance apt, ni à la construction, ni à l'exécution
  # (utilisateur non root). Correctif absent de l'image Microsoft du 2026-11-05 (apt 2.8.3).
  - vulnerability: CVE-2026-109518
    package:
      name: apt
    reason: "apt jamais lancé dans les images ; à retirer dès une image de base avec apt 2.8.4ubuntu0.1, au plus tard 2026-11-30"
  - vulnerability: CVE-2026-109518
    package:
      name: libapt-pkg6.0t64
    reason: "bibliothèque d'apt, même raison ; à retirer dès une image de base avec apt 2.8.4ubuntu0.1, au plus tard 2026-11-30"
