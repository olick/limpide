# Démo en ligne (ADR-006) : une seule machine, 4 Go de mémoire.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm ingestion <commande>
# Seul Caddy est exposé ; PostgreSQL reste sur le réseau interne.
# Vectorisation (ADR-012, révisé le 2026-10-18) : Qwen3-Embedding-8B servi par OVHcloud AI Endpoints, sans secours.
# Le profil « ollama » (bge-m3) ne sert plus de secours : revenir à bge-m3 est un changement de configuration suivi
# d'un embed (ADR-017), pas une bascule d'hébergeur.
# Projet distinct de l'environnement de développement (docker-compose.yml) : volumes séparés.
# Images (S7) : sur le VPS, celles que la chaîne CI/CD a publiées sur ghcr.io, version dans .env.version (écrit par
# deploy/deployer.sh) ; rien n'y est construit. Sans IMAGE_TAG (test local de cette configuration), « --build »
# construit les images sous la version « local ».
name: limpide-prod

x-app-env: &app-env
  ConnectionStrings__Rag: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-rag};Username=${POSTGRES_USER:-rag};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.prod}"
  # Modèle et réglages de vectorisation : src/appsettings.shared.json (Qwen3-Embedding-8B par l'API d'OVHcloud, France).
  Embedding__Provider: "${EMBEDDING_PROVIDER:-OpenAI}"
  Embedding__Endpoint: "${EMBEDDING_ENDPOINT:-https://oai.endpoints.kepler.ai.cloud.ovh.net/v1}"
  Embedding__ApiKey: "${OVH_AI_ENDPOINTS_KEY:?OVH_AI_ENDPOINTS_KEY manquant dans .env.prod}"
  Mistral__ApiKey: "${MISTRAL_API_KEY:?MISTRAL_API_KEY manquant dans .env.prod}"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
      # Vide ou absent : adresse inexistante en HTTP (un bloc sans adresse casserait la configuration de Caddy).
      REDIRECT_FROM: "${REDIRECT_FROM:-http://redirection-inactive.invalid}"
      # Back office (ex. « admin.limpide-ia.fr ») ; vide ou absent : bloc inactif.
      ADMIN_ADDRESS: "${ADMIN_ADDRESS:-http://admin-inactif.invalid}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    mem_limit: 128m

  web:
    build:
      context: .
      target: web
    image: ghcr.io/olick/limpide-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app-env
      DataProtection__KeysPath: /keys
      # Lien « Back office » en bas de la page (vide : pas de lien).
      Site__AdminUrl: "${ADMIN_ADDRESS:-}"
      # Supervision (ADR-018) : collecteur du projet limpide-supervision, joint par son nom sur le réseau de la démo
      # (http://collecteur:4317). Vide ou absent : rien n'est mesuré ni exporté (deploy/README.md, « Supervision »).
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    volumes:
      - web_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  # Back office : seulement la base (ni clé Mistral, ni Ollama). Connexion OpenID Connect ; fournisseur et
  # administrateurs autorisés dans .env.prod. Sans ADMIN_OIDC_*, la page d'accueil dit « connexion non configurée ».
  admin:
    build:
      context: .
      target: admin
    image: ghcr.io/olick/limpide-admin:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ConnectionStrings__Rag: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-rag};Username=${POSTGRES_USER:-rag};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.prod}"
      Admin__Authority: "${ADMIN_OIDC_AUTHORITY:-}"
      Admin__ClientId: "${ADMIN_OIDC_CLIENT_ID:-}"
      Admin__ClientSecret: "${ADMIN_OIDC_CLIENT_SECRET:-}"
      Admin__AllowedUsers__0: "${ADMIN_ALLOWED_USER:-}"
      DataProtection__KeysPath: /keys
    volumes:
      - admin_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schéma : limpide run --rm ingestion migrate (deploy/README.md), plus de scripts d'initialisation.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # bge-m3 sur le serveur (ADR-012) : jamais démarré par « up » ; ne sert plus de secours depuis la bascule sur Qwen
  # (2026-10-18) : un retour à bge-m3 demande aussi modèle, consigne de question et seuil (ADR-017).
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      # Modèle gardé en mémoire indéfiniment : pas de démarrage à froid entre deux visites.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g

  # Télécharge bge-m3 au premier démarrage (≈ 1,2 Go), puis ne fait plus rien : le modèle reste dans le volume.
  ollama-model:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["ollama", "pull", "bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Console d'ingestion, lancée à la demande : jamais démarrée par « up ».
  ingestion:
    build:
      context: .
      target: ingestion
    image: ghcr.io/olick/limpide-ingestion:${IMAGE_TAG:-local}
    profiles: ["outils"]
    environment:
      <<: *app-env
    volumes:
      - ingestion_data:/limpide/data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

volumes:
  pgdata:
  ollama:
  caddy_data:
  caddy_config:
  ingestion_data:
  web_keys:
  admin_keys:
