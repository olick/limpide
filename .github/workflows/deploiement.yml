# Déploiement de la démo (S7, session 4a) : après chaque fusion sur main qui touche l'application ou sa configuration.
#   1. images : construites une fois et publiées sur ghcr.io (deploy/publier-images.sh, version par
#      deploy/version-images.sh ; une version déjà publiée n'est pas reconstruite) ;
#   2. analyse : vulnérabilités des images publiées (deploy/analyser-images.sh, Grype) ; bloque le déploiement si une
#      vulnérabilité élevée ou critique a un correctif disponible ; job sans aucun secret ;
#   3. vps : après validation manuelle (environnement « production », relecteur requis), SSH vers le VPS avec une clé
#      dédiée dont la seule commande permise est deploy/deployer.sh <version> (pull, migrate, redémarrage, vérification).
# La qualité des réponses est contrôlée avant la fusion (evaluation.yml, ADR-016) : avec « Évaluation » en contrôle
# requis de main, ce workflow ne part que de code qui a passé la barrière, ou qui n'y touche pas.
# Comme les autres workflows, il n'orchestre que des scripts lançables à la main.
name: Déploiement

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "corpus.json"
      - "eval/questions.json"
      # Rapports d'évaluation versionnés, copiés dans l'image web (page /evaluation).
      - "eval/results/*.json"
      - "docker-compose.prod.yml"
      # DAG d'Airflow : lu sur le serveur dans ~/limpide, mis à jour par le git merge de deployer.sh. Version des images
      # inchangée : rien n'est reconstruit ni redémarré, sauf si la configuration du serveur (.env.prod) a changé
      # depuis (constaté le 2026-10-19 : la PR #25 n'était pas arrivée).
      - "pipelines/airflow/dags/**"
      - "deploy/**"
      # Scripts de l'évaluation, sans effet sur le VPS : leur modification ne redéploie pas (ADR-016).
      - "!deploy/evaluer.sh"
      - "!deploy/evaluation-requise.sh"
      - "!deploy/exporter-corpus.sh"
      - ".github/workflows/deploiement.yml"
  workflow_dispatch:

permissions:
  contents: read

# Jamais deux déploiements en même temps, et jamais d'annulation en cours de route.
concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  images:
    name: Images (ghcr.io)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publier sur ghcr.io avec le jeton de l'exécution : aucun secret à stocker
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tout l'historique : la version est le dernier commit qui touche les sources des images

      - id: version
        run: echo "version=$(deploy/version-images.sh)" >> "$GITHUB_OUTPUT"

      - name: Connexion à ghcr.io
        run: echo "$JETON" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          JETON: ${{ github.token }}

      - run: deploy/publier-images.sh

  analyse:
    name: Analyse des images
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: deploy/analyser-images.sh "$VERSION"
        env:
          VERSION: ${{ needs.images.outputs.version }}

  vps:
    name: Déploiement sur le VPS
    needs: [images, analyse]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      # Clé privée en secret de l'environnement production ; empreinte du serveur enregistrée (variable) : la chaîne
      # refuse de parler à un autre serveur que le VPS.
      - name: Clé SSH et empreinte du serveur
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$EMPREINTE" > ~/.ssh/known_hosts
        env:
          CLE: ${{ secrets.SSH_DEPLOY_KEY }}
          EMPREINTE: ${{ vars.VPS_KNOWN_HOSTS }}

      - name: deploy/deployer.sh ${{ needs.images.outputs.version }}
        run: >
          ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes
          debian@57.129.175.88 "$VERSION"
        env:
          VERSION: ${{ needs.images.outputs.version }}
