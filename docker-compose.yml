services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schéma : commande migrate de la console (src/Limpide.Infrastructure/Migrations), plus de scripts d'initialisation.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama

  # Back office sur http://localhost:5182, sans lancer le débogueur. Même port que `dotnet run` (adresse de retour
  # déjà inscrite chez le fournisseur d'identité) : `docker compose stop admin` avant de le déboguer.
  # Après une modification du code : `docker compose up -d --build admin`.
  admin:
    build:
      context: .
      target: admin
    image: limpide-admin
    restart: unless-stopped
    environment:
      ConnectionStrings__Rag: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Fournisseur OpenID Connect et administrateur autorisé : mêmes valeurs que les user-secrets (vides : l'accueil
      # indique « connexion non configurée »).
      Admin__Authority: "${ADMIN_OIDC_AUTHORITY:-}"
      Admin__ClientId: "${ADMIN_OIDC_CLIENT_ID:-}"
      Admin__ClientSecret: "${ADMIN_OIDC_CLIENT_SECRET:-}"
      Admin__AllowedUsers__0: "${ADMIN_ALLOWED_USER:-}"
      DataProtection__KeysPath: /keys
      # Lien « Voir la démo » : la démo locale (dotnet run, profil http).
      Site__DemoUrl: "http://localhost:5181"
      # Grafana de la pile locale (supervision/), si elle tourne.
      Site__SupervisionUrl: "http://localhost:3000/"
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5182}:8080"
    volumes:
      - admin_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
  admin_keys:
